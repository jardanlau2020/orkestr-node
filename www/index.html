<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NODE_NAME__ — Service Status</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--fg:#e7e9ee;--mut:#8b93a7;--ok:#3ecf8e}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:760px;margin:0 auto;padding:56px 24px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{color:var(--mut);margin:0 0 32px}
  .card{background:var(--card);border:1px solid #232733;border-radius:10px;padding:20px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21252f}
  .row:last-child{border-bottom:0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px}
  .mut{color:var(--mut)}
  footer{margin-top:36px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>__NODE_NAME__</h1>
  <p class="sub">Edge service · EU region</p>

  <div class="card">
    <div class="row"><span><span class="dot"></span>API</span><span class="mut">operational</span></div>
    <div class="row"><span><span class="dot"></span>WebSocket gateway</span><span class="mut">operational</span></div>
    <div class="row"><span><span class="dot"></span>Static assets</span><span class="mut">operational</span></div>
  </div>

  <div class="card">
    <div class="row"><span class="mut">Region</span><span>eu-central</span></div>
    <div class="row"><span class="mut">Build</span><span>2026.10.18</span></div>
    <div class="row"><span class="mut">Status page</span><span class="mut">/status</span></div>
  </div>

  <footer>Automated status page. All times UTC.</footer>
</div>
</body>
</html>
